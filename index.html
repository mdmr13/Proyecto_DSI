            color: #7b61a8;
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

        }

        .hero-content {
            max-width: 700px;
        }

            font-size: 48px;
