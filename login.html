```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8d9ec, #dcd6ff);
        }

        .login-container {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .login-container h1 {
            text-align: center;
            color: #5d4b8c;
            margin-bottom: 10px;
        }

        .login-container p {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #9b82d0;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #7b61a8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-login:hover {
            background: #654d91;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #999;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Bienvenido</h1>
        <p>Inicia sesión para continuar</p>

        <form>

            <div class="input-group">
                <label for="usuario">Usuario</label>
                <input 
                    type="text" 
                    id="usuario" 
                    name="usuario"
                    placeholder="Ingresa tu usuario"
                >
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    placeholder="Ingresa tu contraseña"
                >
            </div>

            <button type="submit" class="btn-login">
                Ingresar
            </button>

        </form>

        <div class="footer">
            Sistema de administración
        </div>

    </div>

</body>
</html>
```
